; The hierarchical model: an inspiral (wavelet) submodel and a ringdown (QNM)
; submodel, each analysing its own side of a gate in the data.
;
; The options that depend on which wavelets or modes are present (the
; reference phase, the phase names, the amplitude names, and the reference
; amplitude) are given in the inspiral and ringdown prior files, so that those
; files can be swapped without changing this one.

[model]
name = hierarchical
submodels = inspiral ringdown

[inspiral__model]
name = gated_gaussian_multimargphase
normalize =
paint-method = gs
low-frequency-cutoff = H1:6.0 L1:6.0 V1:6.0
ignore-failed-waveforms =
sample_snrs =
fiducial_amp_value = 1e-21
phase_samples = 512

[ringdown__model]
name = gated_gaussian_multimargphasepol
normalize =
paint-method = gs
low-frequency-cutoff = H1:6.0 L1:6.0 V1:6.0
sample_snrs =
fiducial_amp_value = 1e-21
ref_mode =
snr-mode-map = 220:amp220_snr:amp220
phase_samples = 512
polarization_samples = 512
polarization_bounds = 0 pi
