; The inspiral model with one wavelet, with the agnostic polarization prior.
;
; The wavelet is the reference: it is centered at tc (eta = 0), and its phase
; is marginalized over. Its center can be at most 3 tau after the split
; (tc + t_switch). Its ellipticity is uniform in [-1, 1] (either handedness),
; and its angle theta is uniform in [0, pi) (sampled as 2 theta, which is
; cyclic on [0, 2 pi)); a rotation of theta is the same as a change in
; polarization, so the polarization is fixed to 0. Its SNR has the BayesWave
; signal prior.

[static_params]
inspiral__approximant = wavelet_modes
inspiral__polarization = 0
inspiral__wavelets = 1
inspiral__wavelet_ref_index = 1
inspiral__wavelet_max_duration = 4
inspiral__wavelet_taper = start
inspiral__wavelet_taper_duration = 0.05
inspiral__phi1 = 0

[variable_params]
inspiral__amp1_snr =
inspiral__freq1 =
inspiral__q1 =
inspiral__eps1 =
inspiral__twotheta1 =

; the options of the inspiral model that depend on the wavelets
[inspiral__model]
ref_phase = phi1
phase_names = phi1
snr-mode-map = 1:amp1_snr:amp1

[prior-inspiral__amp1_snr]
name = bayeswave_signal_snr
rho_star = 5
min-inspiral__amp1_snr = 0.
max-inspiral__amp1_snr = 50.

[prior-inspiral__freq1]
name = uniform
min-inspiral__freq1 = 15
max-inspiral__freq1 = 200

[prior-inspiral__q1]
name = uniform
min-inspiral__q1 = 0.1
max-inspiral__q1 = 8

[waveform_transforms-inspiral__tau1]
name = custom
inputs = inspiral__q1, inspiral__freq1
inspiral__tau1 = inspiral__q1 / inspiral__freq1

[prior-inspiral__eps1]
name = uniform
min-inspiral__eps1 = -1
max-inspiral__eps1 = 1

[prior-inspiral__twotheta1]
name = uniform_angle
cyclic_domain =

[waveform_transforms-inspiral__theta1]
name = custom
inputs = inspiral__twotheta1
inspiral__theta1 = inspiral__twotheta1 / 2

[constraint-wav1]
name = custom
constraint_arg = -t_switch <= 3 * inspiral__q1 / inspiral__freq1
