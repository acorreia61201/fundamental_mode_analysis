; The inspiral model with three wavelets, with the agnostic polarization prior.
;
; The frequencies are ordered, freq1 <= freq2 <= freq3, with the hypertriangle
; map of three samples uniform in [15, 200] Hz. The highest-frequency wavelet
; (3) is the reference: it is centered at tc (eta = 0), and its phase is
; marginalized over. The other wavelets (1 and 2) are each centered eta_k from
; tc, with eta_k uniform in [-0.1, 0.1) s, so they may come in any order, and
; each has a free phase (relative to the reference). Each wavelet's center can
; be at most 3 tau after the split (tc + t_switch). Each wavelet has its own
; ellipticity, uniform in [-1, 1] (either handedness), and its own angle theta,
; uniform in [0, pi) (sampled as 2 theta, which is cyclic on [0, 2 pi)); a
; common rotation of the thetas is the same as a change in polarization, so
; the polarization is fixed to 0. The SNRs have the BayesWave signal prior.

[static_params]
inspiral__approximant = wavelet_modes
inspiral__polarization = 0
inspiral__wavelets = 3
inspiral__wavelet_ref_index = 3
inspiral__wavelet_max_duration = 4
inspiral__wavelet_taper = start
inspiral__wavelet_taper_duration = 0.05
inspiral__phi3 = 0

[variable_params]
inspiral__amp1_snr =
inspiral__freq1_samp =
inspiral__q1 =
inspiral__phi1 =
inspiral__eta1 =
inspiral__eps1 =
inspiral__twotheta1 =
inspiral__amp2_snr =
inspiral__freq2_samp =
inspiral__q2 =
inspiral__phi2 =
inspiral__eta2 =
inspiral__eps2 =
inspiral__twotheta2 =
inspiral__amp3_snr =
inspiral__freq3_samp =
inspiral__q3 =
inspiral__eps3 =
inspiral__twotheta3 =

; the options of the inspiral model that depend on the wavelets
[inspiral__model]
ref_phase = phi3
phase_names = phi1 phi2 phi3
snr-mode-map = 1:amp1_snr:amp1 2:amp2_snr:amp2 3:amp3_snr:amp3

[waveform_transforms-inspiral__freq1+inspiral__freq2+inspiral__freq3]
name = custom_multi
inputs = inspiral__freq1_samp, inspiral__freq2_samp, inspiral__freq3_samp
inspiral__freq1, inspiral__freq2, inspiral__freq3 = hypertriangle(inspiral__freq1_samp, inspiral__freq2_samp, inspiral__freq3_samp, bounds=(15,200))

; wavelet 1
[prior-inspiral__amp1_snr]
name = bayeswave_signal_snr
rho_star = 5
min-inspiral__amp1_snr = 0.
max-inspiral__amp1_snr = 50.

[prior-inspiral__freq1_samp]
name = uniform
min-inspiral__freq1_samp = 15
max-inspiral__freq1_samp = 200

[prior-inspiral__q1]
name = uniform
min-inspiral__q1 = 0.1
max-inspiral__q1 = 8

[waveform_transforms-inspiral__tau1]
name = custom
inputs = inspiral__q1, inspiral__freq1
inspiral__tau1 = inspiral__q1 / inspiral__freq1

[prior-inspiral__phi1]
name = uniform_angle
cyclic_domain =

[prior-inspiral__eta1]
name = uniform
min-inspiral__eta1 = -0.1
max-inspiral__eta1 = 0.1

[prior-inspiral__eps1]
name = uniform
min-inspiral__eps1 = -1
max-inspiral__eps1 = 1

[prior-inspiral__twotheta1]
name = uniform_angle
cyclic_domain =

[waveform_transforms-inspiral__theta1]
name = custom
inputs = inspiral__twotheta1
inspiral__theta1 = inspiral__twotheta1 / 2

[constraint-wav1]
name = custom
constraint_arg = inspiral__eta1 - t_switch <= 3 * inspiral__q1 / hypertriangle(inspiral__freq1_samp, inspiral__freq2_samp, inspiral__freq3_samp, bounds=(15,200))[0]

; wavelet 2
[prior-inspiral__amp2_snr]
name = bayeswave_signal_snr
rho_star = 5
min-inspiral__amp2_snr = 0.
max-inspiral__amp2_snr = 50.

[prior-inspiral__freq2_samp]
name = uniform
min-inspiral__freq2_samp = 15
max-inspiral__freq2_samp = 200

[prior-inspiral__q2]
name = uniform
min-inspiral__q2 = 0.1
max-inspiral__q2 = 8

[waveform_transforms-inspiral__tau2]
name = custom
inputs = inspiral__q2, inspiral__freq2
inspiral__tau2 = inspiral__q2 / inspiral__freq2

[prior-inspiral__phi2]
name = uniform_angle
cyclic_domain =

[prior-inspiral__eta2]
name = uniform
min-inspiral__eta2 = -0.1
max-inspiral__eta2 = 0.1

[prior-inspiral__eps2]
name = uniform
min-inspiral__eps2 = -1
max-inspiral__eps2 = 1

[prior-inspiral__twotheta2]
name = uniform_angle
cyclic_domain =

[waveform_transforms-inspiral__theta2]
name = custom
inputs = inspiral__twotheta2
inspiral__theta2 = inspiral__twotheta2 / 2

[constraint-wav2]
name = custom
constraint_arg = inspiral__eta2 - t_switch <= 3 * inspiral__q2 / hypertriangle(inspiral__freq1_samp, inspiral__freq2_samp, inspiral__freq3_samp, bounds=(15,200))[1]

; wavelet 3 (the reference)
[prior-inspiral__amp3_snr]
name = bayeswave_signal_snr
rho_star = 5
min-inspiral__amp3_snr = 0.
max-inspiral__amp3_snr = 50.

[prior-inspiral__freq3_samp]
name = uniform
min-inspiral__freq3_samp = 15
max-inspiral__freq3_samp = 200

[prior-inspiral__q3]
name = uniform
min-inspiral__q3 = 0.1
max-inspiral__q3 = 8

[waveform_transforms-inspiral__tau3]
name = custom
inputs = inspiral__q3, inspiral__freq3
inspiral__tau3 = inspiral__q3 / inspiral__freq3

[prior-inspiral__eps3]
name = uniform
min-inspiral__eps3 = -1
max-inspiral__eps3 = 1

[prior-inspiral__twotheta3]
name = uniform_angle
cyclic_domain =

[waveform_transforms-inspiral__theta3]
name = custom
inputs = inspiral__twotheta3
inspiral__theta3 = inspiral__twotheta3 / 2

[constraint-wav3]
name = custom
constraint_arg = -t_switch <= 3 * inspiral__q3 / hypertriangle(inspiral__freq1_samp, inspiral__freq2_samp, inspiral__freq3_samp, bounds=(15,200))[2]
