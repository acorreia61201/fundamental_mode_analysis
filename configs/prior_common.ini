; The parameters shared by the inspiral and ringdown models.
;
; tc is the center of the reference wavelet and the time the ringdown starts
; from: the ringdown starts at tc + t_switch, which is also where the data are
; split between the two models (see the gate files). t_switch may be negative,
; so the reference wavelet can be centered after the split.

[static_params]
tc_ref_frame = L1
trigger_time = ${inspiral__data|trigger-time}
f_lower = 5.0
f_ref = 5.0
f_final = 2048

[variable_params]
delta_tc =
t_switch =
ra =
dec =

[prior-delta_tc]
name = uniform
min-delta_tc = -0.1
max-delta_tc = 0.1

[prior-t_switch]
name = uniform
min-t_switch = -0.05
max-t_switch = 0.05

[prior-ra+dec]
name = uniform_sky
azimuthal_cyclic_domain =

[waveform_transforms-tc]
name = custom
inputs = trigger_time, delta_tc
tc = trigger_time + delta_tc
