; The gates, with the outer edges fixed 1.2 s from the trigger time.
;
; The inspiral and ringdown are split at tc + t_switch: the inspiral is gated
; from there on, and the ringdown up to there. The other (outer) edge of each
; gate is fixed in each detector's frame, at the trigger time +/- (1 s + 0.2
; s). The split can be up to ~0.18 s from the trigger time in a detector
; (delta_tc, t_switch, and the light travel time from L1), so each gate is at
; least 1 s long. Since the gate lengths vary, the models need to be
; normalized (see model.ini).

[waveform_transforms-inspiral__t_gate_start]
name = custom
inputs = tc, t_switch
inspiral__t_gate_start = tc + t_switch

[waveform_transforms-ringdown__t_gate_end]
name = custom
inputs = tc, t_switch
ringdown__t_gate_end = tc + t_switch

[waveform_transforms-inspiral__t_gate_end_h1+inspiral__t_gate_end_l1+inspiral__t_gate_end_v1+ringdown__t_gate_start_h1+ringdown__t_gate_start_l1+ringdown__t_gate_start_v1]
name = custom
inputs = trigger_time
inspiral__t_gate_end_h1 = trigger_time + 1.2
inspiral__t_gate_end_l1 = trigger_time + 1.2
inspiral__t_gate_end_v1 = trigger_time + 1.2
ringdown__t_gate_start_h1 = trigger_time - 1.2
ringdown__t_gate_start_l1 = trigger_time - 1.2
ringdown__t_gate_start_v1 = trigger_time - 1.2
