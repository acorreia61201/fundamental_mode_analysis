[static_params]
ringdown__approximant = TdModesfromFinalMassSpin
ringdown__phi220 = 0
ringdown__lmns = 222

[variable_params]
ringdown__inclination =
ringdown__final_mass =
ringdown__final_spin =
ringdown__amp220_snr =
ringdown__amp221 =
ringdown__phi221 =
ringdown__dbetarad =
ringdown__dphisamp =

[ringdown__model]
ref_phase = phi220
ref_amp = amp220
amp_names = amp220
phase_names = phi220 phi221

[prior-ringdown__inclination]
name = sin_angle

[prior-ringdown__final_mass]
name = uniform
min-ringdown__final_mass = 10
max-ringdown__final_mass = 500

[prior-ringdown__final_spin]
name = uniform
min-ringdown__final_spin = -0.99
max-ringdown__final_spin = 0.99

[prior-ringdown__amp220_snr]
name = bayeswave_signal_snr
rho_star = 5
min-ringdown__amp220_snr = 0.
max-ringdown__amp220_snr = 50.

[prior-ringdown__amp221]
name = uniform
min-ringdown__amp221 = 0.
max-ringdown__amp221 = 2.

[prior-ringdown__phi221]
name = uniform_angle
cyclic_domain =

[waveform_transforms-ringdown__t0]
name = custom
inputs = t_switch
ringdown__t0 = t_switch

[prior-ringdown__dbetarad]
name = uniform
min-ringdown__dbetarad = -0.25
max-ringdown__dbetarad = 0.25

[waveform_transforms-ringdown__dbeta]
name = custom
inputs = ringdown__dbetarad
ringdown__dbeta = ringdown__dbetarad * pi

[prior-ringdown__dphisamp]
name = uniform_angle
cyclic_domain =

[waveform_transforms-ringdown__dphi]
name = custom
inputs = ringdown__dphisamp
ringdown__dphi = ringdown__dphisamp - pi
