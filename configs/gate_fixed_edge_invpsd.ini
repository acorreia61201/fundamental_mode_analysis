; The gates, with the outer edges fixed (the inverse PSD length + 0.2 s) from
; the trigger time; e.g., 8.2 s for an 8 s inverse PSD, as in the
; fixed_edge_8s run.
;
; As in gate_fixed_edge_1s.ini, the inspiral and ringdown are split at
; tc + t_switch, and the outer edge of each gate is fixed in each detector's
; frame. The gates are then at least as long as the inverse PSD (the split is
; at most ~0.18 s from the trigger time). The analysis segment should cover
; the gates; e.g., the fixed_edge_8s run used analysis-start-time = -6 and
; analysis-end-time = 6 (data.ini has -2 and 2, for the 1 s gates).

[waveform_transforms-inspiral__t_gate_start]
name = custom
inputs = tc, t_switch
inspiral__t_gate_start = tc + t_switch

[waveform_transforms-ringdown__t_gate_end]
name = custom
inputs = tc, t_switch
ringdown__t_gate_end = tc + t_switch

[waveform_transforms-inspiral__t_gate_end_h1+inspiral__t_gate_end_l1+inspiral__t_gate_end_v1+ringdown__t_gate_start_h1+ringdown__t_gate_start_l1+ringdown__t_gate_start_v1]
name = custom
inputs = trigger_time
inspiral__t_gate_end_h1 = trigger_time + ${inspiral__data|psd-inverse-length} + 0.2
inspiral__t_gate_end_l1 = trigger_time + ${inspiral__data|psd-inverse-length} + 0.2
inspiral__t_gate_end_v1 = trigger_time + ${inspiral__data|psd-inverse-length} + 0.2
ringdown__t_gate_start_h1 = trigger_time - ${inspiral__data|psd-inverse-length} - 0.2
ringdown__t_gate_start_l1 = trigger_time - ${inspiral__data|psd-inverse-length} - 0.2
ringdown__t_gate_start_v1 = trigger_time - ${inspiral__data|psd-inverse-length} - 0.2
