[variable_params]

[static_params]
delta_tc = -0.001
inclination = 2.6179938779914944
ra = 3.5
dec = 0.73
distance = 1500
srcmass1 = 200
srcmass2 = 50
approximant = nrsxs
sxs_id = SXS:BBH:1984
f_lower = 3.98667
taper = start
taper_method = constant
taper_window = 1.0
f_ref = 3.98667
trigger_time = 1242442967.445
; random number in [0, 2pi]
polarization = 2.644613093937869 

[waveform_transforms-tc]
name = custom
inputs = trigger_time, delta_tc
tc = trigger_time + delta_tc

[waveform_transforms-redshift]
name = custom
inputs = distance
redshift = redshift(distance)

[waveform_transforms-comoving_volume]
name = custom
inputs = redshift
comoving_volume = cosmological_quantity_from_redshift(redshift, 'comoving_volume')

[waveform_transforms-mass1]
name = custom
inputs = srcmass1, redshift
mass1 = srcmass1 * (1 + redshift)

[waveform_transforms-mass2]
name = custom
inputs = srcmass2, redshift
mass2 = srcmass2 * (1 + redshift)

[waveform_transforms-final_mass]
name = custom
inputs = mass1, mass2
final_mass = final_mass_from_initial(mass1, mass2)

[waveform_transforms-final_spin]
name = custom
inputs = mass1, mass2
final_spin = final_spin_from_initial(mass1, mass2)

[waveform_transforms-mtotal]
name = custom
inputs = mass1, mass2
mtotal = mass1 + mass2
